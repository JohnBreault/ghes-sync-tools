name: CodeQL Action Sync Tool
on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch: # Allows manual triggering of the workflow

jobs:
  sync:
    runs-on: Ent_Windows_runners

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download codeql-action-sync tool
        shell: pwsh
        run: |
          # fetch the latest version number
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/github/codeql-action-sync-tool/releases/latest"
          $VERSION = $release.tag_name
          Write-Host "latest vesion number is v${VERSION}"

          # download the tool
          $downloadUrl = "https://github.com/github/codeql-action-sync-tool/releases/download/${VERSION}/codeql-action-sync_${VERSION}_windows_amd64.tar.gz"
          Invoke-WebRequest -Uri $downloadUrl -OutFile "codeql-action-sync.tar.gz"
          tar -xzf codeql-action-sync.tar.gz
          New-Item -Path ".\cache" -ItemType Directory -Force | Out-Null

      - name: Download CodeQL-Action bundle and assets
        shell: pwsh
        run: |
          .\codeql-action-sync.exe pull --cache-dir .\cache

      - name: Remove unnecessary release assets
        shell: pwsh
        run: |
          # Whitelist approach: keep only assets needed for Linux and Windows runners.
          # Removes macOS, universal bundles, and .tar.gz bundle variants.
          # Change the keep patterns as needed for your environment.
          $assetDirs = Get-ChildItem -Path ".\cache\releases\codeql-bundle-*\assets" -Directory -ErrorAction SilentlyContinue
          foreach ($dir in $assetDirs) {
              Write-Host "=== $($dir.Parent.Name) ==="
              foreach ($file in (Get-ChildItem -Path $dir.FullName -File -ErrorAction SilentlyContinue)) {
                  $keep = switch -Wildcard ($file.Name) {
                      {$_ -like '*linux*.tar.zst' -or $_ -like '*win*.tar.zst'}                                 { $true; break } # platform bundles
                      {$_ -like '*linux*.tar.zst.checksum.txt' -or $_ -like '*win*.tar.zst.checksum.txt'}       { $true; break } # checksums
                      {$_ -like 'update-job-proxy-linux*' -or $_ -like 'update-job-proxy-win*'}                 { $true; break } # Dependabot/auto-fix proxy
                      {$_ -like 'cli-version-*.txt'}                                                             { $true; break } # CLI version metadata
                      default                                                                                     { $false }
                  }
                  if ($keep) {
                      Write-Host "  Keeping:  $($file.Name)"
                  } else {
                      Write-Host "  Removing: $($file.Name)"
                      Remove-Item -Path $file.FullName -Force -ErrorAction SilentlyContinue
                  }
              }
          }

      - name: Sync assets to GHES
        shell: pwsh
        run: |
          .\codeql-action-sync.exe push --force --cache-dir .\cache --destination-url ${{ vars.GHES_URL }} --destination-token "${{ secrets.CODEQL_ACTION_SYNC_TOKEN }}"

      - name: Mark latest release on GHES
        shell: pwsh
        run: |
          # The sync tool can recreate releases out of order, causing an older
          # version to be stamped as "latest." Query GHES directly for its
          # codeql-bundle releases and mark the highest semver as latest.
          $ghesApi = "${{ vars.GHES_URL }}/api/v3"
          $token   = "${{ secrets.CODEQL_ACTION_SYNC_TOKEN }}"
          $repo    = "github/codeql-action"
          $headers = @{ Authorization = "token $token" }

          $releases = Invoke-RestMethod -Uri "$ghesApi/repos/$repo/releases?per_page=100" -Headers $headers

          $best = $releases |
              Where-Object { $_.tag_name -match '^codeql-bundle-v\d' -and -not $_.draft -and -not $_.prerelease } |
              Sort-Object { [version]($_.tag_name -replace '^codeql-bundle-v', '') } |
              Select-Object -Last 1

          if ($best) {
              Invoke-RestMethod -Uri "$ghesApi/repos/$repo/releases/$($best.id)" `
                  -Method Patch -Headers $headers `
                  -ContentType "application/json" `
                  -Body '{"make_latest":"true"}' | Out-Null

              Write-Host "Marked $($best.tag_name) (release $($best.id)) as latest on GHES"
          }
          else {
              Write-Host "::warning::No codeql-bundle releases found on GHES"
          }