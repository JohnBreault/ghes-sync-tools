name: CodeQL Action Sync Tool
on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch: # Allows manual triggering of the workflow

jobs:
  sync:
    runs-on: Ent_Linux_runners
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download codeql-action-sync tool
        run: |
          # fetch the latest version number
          VERSION=$(curl -s https://api.github.com/repos/github/codeql-action-sync-tool/releases/latest | jq -r '.tag_name')
          echo "latest vesion number is v${VERSION}"

          # download the tool
          curl -L -o codeql-action-sync.tar.gz "https://github.com/github/codeql-action-sync-tool/releases/download/${VERSION}/codeql-action-sync_${VERSION}_linux_amd64.tar.gz"
          tar -xzf codeql-action-sync.tar.gz
          mkdir ./cache

      - name: Download CodeQL-Action bundle and assets
        run: |
          ./codeql-action-sync pull --cache-dir ./cache

      - name: Remove unnecessary release assets
        run: |
           # Whitelist approach: keep only assets needed for Linux and Windows runners.
           # Removes macOS, universal bundles, and .tar.gz bundle variants.
           # Change the keep patterns as needed for your environment.
           for dir in ./cache/releases/codeql-bundle-*/assets; do
             [ -d "$dir" ] || continue
             echo "=== $(basename "$(dirname "$dir")") ==="
             for file in "$dir"/*; do
               [ -f "$file" ] || continue
               name=$(basename "$file")
               keep=false
               case "$name" in
                 *linux*.tar.zst|*win*.tar.zst)                       keep=true ;; # platform bundles
                 *linux*.tar.zst.checksum.txt|*win*.tar.zst.checksum.txt) keep=true ;; # checksums
                 update-job-proxy-linux*|update-job-proxy-win*)       keep=true ;; # Dependabot/auto-fix proxy
                 cli-version-*.txt)                                   keep=true ;; # CLI version metadata
               esac
               if $keep; then
                 echo "  Keeping:  $name"
               else
                 echo "  Removing: $name"
                 rm -f "$file"
               fi
             done
           done

      - name: Sync assets to GHES
        run: |
           ./codeql-action-sync push --cache-dir ./cache --destination-url https://code.flankspeed.us.navy.mil --destination-token ${{ secrets.CODEQL_ACTION_SYNC_TOKEN }}
 