name: CodeQL Action Sync Tool

on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch: # Allows manual triggering of the workflow

jobs:
  sync:
    runs-on: Ent_Windows_runners
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download codeql-action-sync tool
        shell: pwsh
        run: |
          # fetch the latest version number
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/github/codeql-action-sync-tool/releases/latest"
          $VERSION = $release.tag_name
          Write-Host "latest version number is $VERSION"

          # download the tool
          $downloadUrl = "https://github.com/github/codeql-action-sync-tool/releases/download/$VERSION/codeql-action-sync_${VERSION}_windows_amd64.tar.gz"
          Invoke-WebRequest -Uri $downloadUrl -OutFile "codeql-action-sync.tar.gz"

          tar -xzf codeql-action-sync.tar.gz
          New-Item -Path ".\cache" -ItemType Directory -Force | Out-Null

      - name: Download CodeQL-Action bundle and assets
        shell: pwsh
        run: |
          .\codeql-action-sync.exe pull --cache-dir .\cache

      - name: Remove OSX and .tar.gz release assets
        shell: pwsh
        run: |
          Get-ChildItem -Path ".\cache\releases\codeql-bundle-*\assets\*osx*" -File -ErrorAction SilentlyContinue |
            Remove-Item -Force -ErrorAction SilentlyContinue

          Get-ChildItem -Path ".\cache\releases\codeql-bundle-*\assets\*.tar.gz" -File -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -notlike "update-job*" } |
            Remove-Item -Force -ErrorAction SilentlyContinue

      - name: Sync assets to GHES
        shell: pwsh
        run: |
          .\codeql-action-sync.exe push --cache-dir .\cache --destination-url https://code.flankspeed.us.navy.mil --destination-token "${{ secrets.CODEQL_ACTION_SYNC_TOKEN }}"